<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }} - Tunless</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --bg-light: #f5f7fa;
            --bg-dark: #0f0f1e;
            --text-light: #2d3748;
            --text-dark: #e2e8f0;
            --card-light: #ffffff;
            --card-dark: #1a1a2e;
            --accent: #25D366;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-light);
            color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body.dark-mode {
            background: var(--bg-dark);
            color: var(--text-dark);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Navigation Bar */
        nav {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            padding: 12px 30px;
            border-radius: 15px;
            margin-bottom: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.25);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 20px;
            z-index: 100;
            animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-links {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 10px;
            transition: all 0.3s ease;
            position: relative;
            font-size: 0.95em;
        }

        nav a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: white;
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        nav a:hover::before { width: 70%; }
        nav a.active { background: rgba(255, 255, 255, 0.25); }

        .theme-toggle {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.3em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
        }

        .theme-toggle:hover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.08);
        }

        .sun-icon, .moon-icon {
            width: 24px;
            height: 24px;
            transition: opacity 0.3s ease;
        }

        .sun-icon { opacity: 1; }
        .sun-icon.hidden { opacity: 0; position: absolute; }
        .moon-icon { opacity: 0; position: absolute; }
        .moon-icon.visible { opacity: 1; position: static; }

        /* Hero Section (только для главной) */
        .hero {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            animation: fadeInUp 0.8s ease 0.2s both;
        }

        .hero-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            animation: scaleInDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 768px) {
            .hero-logo { width: 80px; height: 80px; }
        }

        .hero h1 {
            font-size: 3em;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: scaleInDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .hero-subtitle {
            font-size: 1.25em;
            color: #666;
            margin-top: 15px;
            animation: fadeInUp 0.8s ease 0.4s both;
        }

        body.dark-mode .hero-subtitle { color: #aaa; }

        /* Page Title (для всех страниц кроме главной) */
        .page-title {
            font-size: 2.5em;
            font-weight: 800;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: scaleInDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleInDown {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Content */
        .content {
            line-height: 1.9;
            animation: fadeInUp 0.8s ease 0.3s both;
        }

        .content h2 {
            color: var(--primary);
            margin-top: 50px;
            margin-bottom: 30px;
            font-size: 2.2em;
            position: relative;
            padding-bottom: 20px;
            font-weight: 700;
        }

        .content h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 80px;
            height: 5px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .content h3 {
            color: var(--primary-dark);
            margin-top: 30px;
            margin-bottom: 20px;
            font-size: 1.6em;
            font-weight: 600;
        }

        .content ul, .content ol { margin-left: 30px; margin-bottom: 25px; }
        .content li { margin-bottom: 15px; transition: all 0.3s ease; padding-left: 10px; }
        .content li:hover { padding-left: 20px; color: var(--primary); }

        /* Ссылки в контенте (исключая CTA-кнопки) */
        .content a:not(.cta-button) {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: all 0.3s ease;
            padding-bottom: 2px;
        }

        .content a:not(.cta-button)::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .content a:not(.cta-button):hover { color: var(--primary-dark); }
        .content a:not(.cta-button):hover::after { width: 100%; }

        /* Card Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin: 30px 0;
        }

        .card {
            background: var(--card-light);
            border-radius: 15px;
            padding: 25px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            cursor: pointer;
            animation: fadeInUp 0.6s ease;
        }

        body.dark-mode .card { background: var(--card-dark); }

        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 25px 50px rgba(102, 126, 234, 0.2);
            border-color: var(--primary);
        }

        .card h3 { margin-top: 0; margin-bottom: 12px; color: var(--primary); }
        .card p { margin: 0; line-height: 1.6; }

        /* Button */
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        /* Code Block */
        pre {
            background: var(--card-light);
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
            margin: 25px 0;
        }

        body.dark-mode pre { background: var(--card-dark); border-color: #444; }

        code {
            font-family: 'Fira Code', 'Monaco', monospace;
            color: var(--primary);
            font-size: 0.95em;
        }

        /* Footer */
        .footer {
            margin-top: 80px;
            text-align: center;
            padding: 40px 20px;
            border-top: 2px solid #e0e0e0;
            animation: fadeInUp 0.8s ease 0.5s both;
        }

        body.dark-mode .footer { border-top-color: #444; }
        .footer p { margin: 10px 0; font-weight: 500; }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .footer a:hover {
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 15px; }
            nav { flex-direction: column; align-items: stretch; position: static; }
            .nav-links { width: 100%; justify-content: space-around; }
            .theme-toggle { width: 100%; }
            .hero h1 { font-size: 2.2em; }
            .hero-subtitle { font-size: 1.1em; }
            .page-title { font-size: 2em; }
            .content h2 { font-size: 1.8em; }
            .content h3 { font-size: 1.3em; }
            .card-grid { grid-template-columns: 1fr; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: var(--bg-light); }
        body.dark-mode ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 6px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-dark); }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="nav-links">
                {% for link in site.nav_links %}
                    <a href="{{ link.url }}" {% if page.url == link.url %}class="active"{% endif %}>{{ link.title }}</a>
                {% endfor %}
            </div>
            <button class="theme-toggle" id="themeToggle" title="Переключить тему">
                <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </nav>

        {% if page.url == '/' %}
            <div class="hero">
                <img src="/Tunless_Modern/assets/images/logo_640x640.GIF" alt="Tunless Logo" class="hero-logo">
                <h1>{{ page.title }}</h1>
                {% if page.subtitle %}<p class="hero-subtitle">{{ page.subtitle }}</p>{% endif %}
            </div>
        {% else %}
            <h1 class="page-title">{{ page.title }}</h1>
        {% endif %}

        <div class="content">
            {{ content }}
        </div>

        <div class="footer">
            <p>© <script>document.write(new Date().getFullYear())</script> <strong>Tunless</strong>. Все права защищены.</p>
            <p style="font-size: 0.95em; margin-top: 15px; opacity: 0.8;">⚡ Быстро • 🔒 Безопасно •  Анонимно</p>
        </div>
    </div>

    <script>
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const isDarkMode = localStorage.getItem('darkMode') === 'true';
        if (isDarkMode) {
            document.body.classList.add('dark-mode');
            sunIcon.classList.add('hidden');
            moonIcon.classList.add('visible');
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark);
            
            if (isDark) {
                sunIcon.classList.add('hidden');
                moonIcon.classList.add('visible');
            } else {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.remove('visible');
            }
            
            themeToggle.style.transform = 'scale(0.9) rotate(-180deg)';
            setTimeout(() => {
                themeToggle.style.transform = 'scale(1) rotate(0deg)';
            }, 300);
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            if (link.getAttribute('href') === window.location.pathname) {
                link.classList.add('active');
            }
        });

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
